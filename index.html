<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#192628" />
  <meta name="description" content="A little space to play with light. Touch, swing, and discover." />
  <title>Luma — a little light.</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23da613b'/%3E%3Cpath d='M32 9v14M12 43Q16 22 32 22Q48 22 52 43Z' fill='%23f6eedb' stroke='%23f6eedb' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;550;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body data-mood="midnight">
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9M7 5.7a8 8 0 1 0 10 0"/></symbol>
    <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 8h12a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h6a2.5 2.5 0 1 1-2.5 2.5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3Z"/></symbol>
    <symbol id="i-flies" viewBox="0 0 24 24"><path d="m8 5 1.4 4.6L14 11l-4.6 1.4L8 17l-1.4-4.6L2 11l4.6-1.4ZM18 3v4m-2-2h4m-2 10v6m-3-3h6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h5m4 0h7M4 17h9m4 0h3"/><circle cx="11" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4ZM17 8a6 6 0 0 1 0 8"/><path class="mute-stroke" d="m19 4-14 16"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 5v6h6M4.5 10a8 8 0 1 1 .5 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-nudge" viewBox="0 0 24 24"><path d="M3 12h18m-5-5 5 5-5 5M8 7l-5 5 5 5"/></symbol>
  </defs></svg>
  <header class="header">
    <a class="wordmark" href="./" aria-label="Luma home">luma<span aria-hidden="true">✳</span></a>
    <button id="sound" class="icon-button sound-button" aria-label="Sound" aria-pressed="false" data-tip="Sound"><svg><use href="#i-sound"/></svg></button>
  </header>
  <main class="studio" aria-label="Interactive light studio">
    <h1 class="sr-only">A little light. A little wonder.</h1>
    <canvas id="lamp" aria-label="Drag the shade to swing, pull the cord to toggle the light, or swipe the air to create wind. Controls and instructions are also available in Studio settings."></canvas>
    <p class="gesture-hint" id="drag-hint">drag to swing <span>·</span> pull for light</p>
    <div class="scene-feedback" id="scene-feedback" aria-hidden="true"></div>
  </main>
  <nav class="dock" aria-label="Light and effects">
    <button id="power" class="icon-button" role="switch" aria-checked="true" aria-label="Pendant light" data-tip="Light"><svg><use href="#i-power"/></svg></button>
    <span class="dock-divider" aria-hidden="true"></span>
    <button id="breeze" class="icon-button" aria-pressed="false" aria-label="Breeze" data-tip="Breeze"><svg><use href="#i-wind"/></svg></button>
    <button id="fireflies" class="icon-button" aria-pressed="false" aria-label="Fireflies" data-tip="Fireflies"><svg><use href="#i-flies"/></svg></button>
    <button id="wish" class="icon-button wish-button" aria-label="Make a wish" data-tip="Make a wish"><svg><use href="#i-spark"/></svg></button>
    <span class="dock-divider" aria-hidden="true"></span>
    <button id="settings-toggle" class="icon-button" popovertarget="settings" aria-label="Studio settings" aria-expanded="false" aria-controls="settings" data-tip="Settings"><svg><use href="#i-settings"/></svg></button>
  </nav>
  <section id="settings" class="settings-panel" popover aria-labelledby="settings-title">
    <div class="settings-header"><h2 id="settings-title">Studio</h2><button class="icon-button" popovertarget="settings" popovertargetaction="hide" aria-label="Close settings"><svg><use href="#i-close"/></svg></button></div>
    <div class="brightness-group"><label for="brightness">Brightness <output id="brightness-value" for="brightness">75%</output></label><input id="brightness" type="range" min="10" max="100" value="75" /></div>
    <fieldset><legend>Atmosphere</legend><div class="moods"><button class="mood" data-mood="daylight" aria-pressed="false"><span class="mood-dot daylight"></span>Day</button><button class="mood" data-mood="golden" aria-pressed="false"><span class="mood-dot golden"></span>Dusk</button><button class="mood active" data-mood="midnight" aria-pressed="true"><span class="mood-dot midnight"></span>Night</button></div></fieldset>
    <fieldset><legend>Material</legend><div class="materials"><button class="material-option" data-material="clay" aria-pressed="true"><span class="sample clay"></span>Clay</button><button class="material-option" data-material="brass" aria-pressed="false"><span class="sample brass"></span>Brass</button><button class="material-option" data-material="glass" aria-pressed="false"><span class="sample glass"></span>Glass</button></div></fieldset>
    <div class="settings-actions"><button id="nudge"><svg><use href="#i-nudge"/></svg>Nudge</button><button id="reset"><svg><use href="#i-reset"/></svg>Reset</button></div>
    <details class="help"><summary>How to play</summary><p>Drag the shade. Pull the cord for light. Swipe the room for wind.</p><p>Invite fireflies and guide them with your pointer or touch. Try the star for a little surprise.</p></details>
  </section>
  <div id="announcement" class="sr-only" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
